<div class="card-LE">
  <div class="card-header-LE">Transit Info</div>
  <div class="card-body-LE">



    <div class="form-radio optional">
      <label>
        <input type="radio" name="orderType" [(ngModel)]="orderType" value="Inward" (change)="onOrderTypeChange()" />
        <span>Inward</span>
      </label>
      <label>
        <input type="radio" name="orderType" [(ngModel)]="orderType" value="Outward" (change)="onOrderTypeChange()" />
        <span>Outward</span>
      </label>
    </div>

    <br />

    <!-- SAP Type Selection -->
    <div *ngIf="orderType" class="sap-row" style="display: flex !important;">
      <div class="form-radio optional sap-radio">
        <label>
          <input type="radio" [(ngModel)]="sapType" value="SAP" (change)="onSapTypeChange()" />
          <span>With SAP</span>
        </label>
        <label>
          <input type="radio" [(ngModel)]="sapType" value="Non-SAP" (change)="onSapTypeChange()" />
          <span>Without SAP</span>
        </label>
      </div>

      <!-- Input fields for PO / Invoice if With SAP -->
      <!-- <div class="input-row" *ngIf="sapType === 'SAP'">
        <div *ngIf="orderType === 'Inward'" class="input-flex">
          <div class="form-field">
            <input type="text" name="ponumber" formControlName="ponumber" placeholder=" " />
            <label>PO Number</label>
          </div>
          
         
        </div>

        <div *ngIf="orderType === 'Outward'" class="input-flex">
          <div class="form-field">
            <input type="text" name="invoicenumber" formControlName="InvoiceNumber" placeholder=" " />
            <label>Invoice Number</label>
          </div>
        </div>
      </div> -->
    </div>


    <form class="form-grid" [formGroup]="transitInfo" *ngIf="showForm">

      <div *ngIf="orderType === 'Inward'" class="form-field">
        <input type="text" formControlName="ponumber" placeholder=" " />
        <label>PO Number</label>

      </div>

      <div *ngIf="orderType === 'Outward'" class="form-field">
        <input type="text" formControlName="invoicenumber" placeholder=" " />
        <label>Invoice Number</label>
      </div>

      <!-- Segment -->
      <div class="form-field">
        <input type="date" formControlName="physicalarrivedatdestinationdateandtime" placeholder="" />
        <label>Physical arrived at destination date</label>

      </div>

      <!-- Customer Profile -->
      <div class="form-field">
        <input type="datetime-local" formControlName="unloadingdateandtime" (change)="updateSIT()" placeholder="" />
        <label>Unloading date and time</label>

      </div>

      <div class="form-field">
        <input type="datetime-local" formControlName="podscanreceiveddateandtime" (change)="updateSIT()"
          placeholder="" />
        <label>POD scan received date and time</label>

      </div>

      <!-- Branch -->
      <div class="form-field">
        <input type="text" formControlName="sit" readonly placeholder="" />
        <label>SIT/SALE</label>

      </div>

      <!-- Branch Zone -->







    </form>
    <div class="text-right" *ngIf="showForm">
      <button type="button" *ngIf="isEditMode" class="btn-secondary" (click)="cancelEdit()">
        Cancel
      </button>

      <button class="btn btn-md btn-raised btnSave" (click)="saveTransitInfo()">
        Save
      </button>

      <button class="btn btn-md btn-raised btnSave move" (click)="saveTransitInfo('next')">
        Save and Next
      </button>

      <button class="btn btn-md btn-raised btnSave prev" (click)="saveTransitInfo('previous')">
        Save and Previous
      </button>
    </div>

  </div>
</div>
