<div class="card-LE">
    <div class="card-header-LE">Insurance Claim Tracking</div>

    <div class="card-body-LE">

        <!-- ✅ ORDER TYPE -->
        <div class="form-radio optional">
            <label>
                <input type="radio" name="orderType" [(ngModel)]="orderType" value="Inward"
                    (change)="onOrderTypeSelection()" />
                <span>Inward</span>
            </label>

            <label>
                <input type="radio" name="orderType" [(ngModel)]="orderType" value="Outward"
                    (change)="onOrderTypeSelection()" />
                <span>Outward</span>
            </label>
        </div>

        <br />

        <!-- ✅ SAP TYPE -->
        <div *ngIf="orderType" class="sap-row" style="display: flex !important;">
            <div class="form-radio optional sap-radio">
                <label>
                    <input type="radio" [(ngModel)]="sapType" value="SAP" (change)="onSapTypeSelection()" />
                    <span>With SAP</span>
                </label>
                <label>
                    <input type="radio" [(ngModel)]="sapType" value="Non-SAP" (change)="onSapTypeSelection()" />
                    <span>Without SAP</span>
                </label>
            </div>

            <!-- ✅ INVOICE INPUT + GET common -->
            <div class="input-row" *ngIf="sapType">
                <div class="input-flex">

                    <div class="form-field flex-1">
                        <input type="text" name="invoicenumber" [(ngModel)]="invoicenumber" placeholder=" " />
                        <label>Invoice Number</label>
                    </div>

                    <button type="button" class="btn-get" (click)="fetchInvoiceDetails()"
                        [disabled]="!invoicenumber || invoicenumber.trim() === ''">
                        GET
                    </button>

                </div>
            </div>

        </div>

        <br />

        <!-- ✅ HEADER FORM -->
        <form [formGroup]="HeaderForm" *ngIf="showTable" class="form-grid">

            <!-- <div class="form-field">
                <input type="text" formControlName="INV_NO" placeholder=" " />
                <label>Invoice Number</label>
            </div> -->

            <div class="form-field">
                <input type="text" formControlName="FI" placeholder=" " />
                <label>Fiscal Year</label>
            </div>

            <div class="form-field">
                <input type="date" formControlName="REP_DATE" placeholder=" " />
                <label>Reported Date</label>
            </div>

            <div class="form-field">
                <input type="text" formControlName="CLAIM_REF" placeholder=" " />
                <label>Claim Reference</label>
            </div>

            <div class="form-field">
                <input type="date" formControlName="INV_DATE" placeholder=" " />
                <label>Invoice Date</label>
            </div>

            <div class="form-field">
                <input type="text" formControlName="INV_BV" placeholder=" " />
                <label>Invoice Basic Value</label>
            </div>

            <div class="form-field">
                <input type="text" formControlName="LOSS_DCL" placeholder=" " />
                <label>Loss Declared</label>
            </div>

            <div class="form-field">
                <input type="text" formControlName="CLM_RF" placeholder=" " />
                <label>Claim Received</label>
            </div>

            <div class="form-field">
                <input type="text" formControlName="SOL_VAL" placeholder=" " />
                <label>Salvage Value</label>
            </div>

            <div class="form-field">
                <input type="text" formControlName="CUSTOMER" placeholder=" " />
                <label>Customer</label>
            </div>

            <div class="form-field">
                <input type="text" formControlName="SO_NO" placeholder=" " />
                <label>SO Number</label>
            </div>

            <div class="form-field">
                <input type="text" formControlName="LOCATION" placeholder=" " />
                <label>Location</label>
            </div>

            <div class="form-field">
                <input type="text" formControlName="DAMAGE_RMK" placeholder=" " />
                <label>Damage Remarks</label>
            </div>

            <div class="form-field">
                <input type="text" formControlName="CLM_INF" placeholder=" " />
                <label>Claim Info Sent</label>
            </div>

            <div class="form-field">
                <input type="text" formControlName="CLM_ST" placeholder=" " />
                <label>Claim Status</label>
            </div>

            <div class="form-field">
                <input type="text" formControlName="CLM_DOC_ST" placeholder=" " />
                <label>Claim Document Status</label>
            </div>

            <div class="form-field">
                <input type="text" formControlName="COURIER_DET" placeholder=" " />
                <label>Courier Details</label>
            </div>

            <div class="form-field">
                <input type="text" formControlName="PAY_ST" placeholder=" " />
                <label>Payment Status</label>
            </div>

            <div class="form-field">
                <input type="text" formControlName="PAY_INFO" placeholder=" " />
                <label>Payment Info</label>
            </div>

            <div class="form-field">
                <input type="text" formControlName="UTR" placeholder=" " />
                <label>UTR</label>
            </div>

            <div class="form-field">
                <input type="date" formControlName="CLM_SET_DT" placeholder=" " />
                <label>Claim Settlement Date</label>
            </div>

        </form>

        <br />

        <!-- ✅ ITEMS TABLE -->
        <div *ngIf="showTable" style="overflow:auto;">
            <form [formGroup]="ItemForm">
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>SI.No</th>
                            <!-- <th>POSNR</th> -->
                            <th>Vehicle Line</th>
                            <th>Vehicle Type</th>
                            <th>Truck Number</th>
                            <th>LR Number</th>
                            <th>AH</th>
                            <th>No. of Sets</th>
                            <th>Transporter</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody formArrayName="ITEMS">
                        <tr *ngFor="let item of items.controls; let i = index" [formGroupName]="i">

                            <td>{{ i + 1 }}</td>

                            <!-- <td><input formControlName="POSNR"></td> -->
                            <td><input formControlName="VEH_LINE"></td>
                            <td><input formControlName="VEHICLE"></td>
                            <td><input formControlName="TRUCK_NO"></td>
                            <td><input formControlName="LR_NO"></td>
                            <td><input formControlName="AH"></td>
                            <td><input formControlName="NO_SETS"></td>
                            <td><input formControlName="TRANSPORTER"></td>

                            <td>
                                <button type="button" (click)="addItemRow()">+</button>
                                <button type="button" (click)="removeItemRow(i)">✖</button>
                            </td>

                        </tr>
                    </tbody>

                </table>
            </form>
        </div>

        <br />

        <div *ngIf="showTable" class="text-right">
            <!-- Normal Save -->
            <button class="btn btn-md btn-raised btnSave" (click)="sapType === 'SAP' ? saveSAP() : saveNonSAP()">
                Save
            </button>

            <!-- Save & Next -->
            <button class="btn btn-md btn-raised btnSave move" (click)="sapType === 'SAP' ? saveSAP('next') : saveNonSAP('next')">
                Save and Next
            </button>

            <!-- Save & Previous -->
            <button class="btn btn-md btn-raised btnSave prev" (click)="sapType === 'SAP' ? saveSAP('previous') : saveNonSAP('previous')">
                Save and Previous
            </button>
        </div>



    </div>
</div>
