<div class="card-LE">
    <div class="card-header-LE">Insurance Claim Tracking</div>
    <div class="card-body-LE">

        <form class="form-grid" [formGroup]="InsuranceClaimTracking">
            <div class="form-field">
                <input type="text" formControlName="FinanceYear" placeholder=" " />
                <label>Finance Year</label>               
            </div>

            <div class="form-field">
                <input type="date" formControlName="ReportedDate" placeholder=" " />
                <label>Reported Date</label>            
            </div>
            <div class="form-field">
                <input type="text" formControlName="ClaimRef" placeholder=" " />
                <label>Claim Ref</label>               
            </div>
            <div class="form-field">
                <input type="text" formControlName="InvoiceNumber" placeholder=" " />
                <label>Invoice Number </label>
                
            </div>
            <div class="form-field">
                <input type="date" formControlName="InvoiceDate" placeholder=" " />
                <label>Invoice Date</label>
                
            </div>

            <div class="form-field">
                <input type="text" formControlName="InvoiceValueBasic" placeholder=" " />
                <label>Invoice Value Basic</label>
                
            </div>
            <div class="form-field">
                <input type="text" formControlName="LossDeclaredRs" placeholder=" " />
                <label>Loss Declared Rs </label>
                
            </div>
            <div class="form-field">
                <input type="text" formControlName="ClaimReceivedFinalised" placeholder=" " />
                <label>Claim Received / Finalised(Rs) </label>
                
            </div>
            <div class="form-field">
                <input type="text" formControlName="SalvageValue" placeholder=" " />
                <label>Solvage Value </label>
                
            </div>

            <div class="form-field">
                <input type="text" formControlName="Customer" placeholder=" " />
                <label>Customer </label>
                
            </div>

            <div class="form-field">
                <input type="text" formControlName="PONumber" placeholder=" " />
                <label>PO Number </label>
                
            </div>
            <div class="form-field">
                <input type="text" formControlName="vechilenumber" id="vechilenumber" placeholder=" " />
                <label for="vechilenumber">Vehicle Number</label>
                
            </div>
            <div class="form-field">
                <input type="number" min="0" formControlName="AhLoadedInTruck" placeholder=" " step="0.01" />
                <label>Ah loaded in the Truck</label>
                
            </div>

            <div class="form-field">
                <input type="text" formControlName="NoOfSets" placeholder=" " />
                <label>No Of Sets /Nos </label>
                
            </div>


            <div class="form-field">
                <input type="text" formControlName="Location" placeholder=" " />
                <label>Location</label>
                
            </div>


            <div class="form-field">
                <input type="date" formControlName="Transporter" placeholder=" " />
                <label>Transporter</label>
                
            </div>
            <div class="form-field">
                <input type="date" formControlName="TruckNumber" placeholder=" " />
                <label>Truck Number</label>
               
            </div>
            <div class="form-field">
                <input type="text" formControlName="LRNumber" placeholder=" " />
                <label>LR Number</label>
                
            </div>
            <div class="form-field">
                <select formControlName="DamageRemarks">
                    <option value="">Select</option>
                    <option value="Packing material damage">Packing material damage</option>
                    <option value="Pallet damage">Pallet damage</option>
                    <option value="Cells damage">Cells damage</option>
                    <option value="Cell Bank damage">Cell Bank damage</option>
                    <option value="Can damage">Can damage</option>
                    <option value="Accident">Accident</option>
                    <option value="Prohibited material loading and seized by Police">
                        Prohibited material loading and seized by Police
                    </option>
                    <option value="Damage during unloading">Damage during unloading</option>
                    <option value="Material in wet condition">Material in wet condition</option>
                    <option value="Damage due to other Materials loaded">
                        Damage due to other Materials loaded
                    </option>
                </select>

                <label>Damage Remarks</label>
               
            </div>

            <div class="form-field">
                <input type="text" formControlName="ClaimInformationSentOn" placeholder=" " />
                <label>Claim Information Sent On</label>
               
            </div>
            <div class="form-field">
                <select formControlName="ClaimStatus">
                    <option value="">Select</option>
                    <option value="Open">Open</option>
                    <option value="Close">Close</option>

                </select>
                <label>Claim Status</label>
               
            </div>
            <div class="form-field">
                <select formControlName="ClaimDocumentsStatus">
                    <option value="">Select</option>
                    <option value="Open">Open</option>
                    <option value="Close">Close</option>

                </select>
                <label>Claim Documents Status</label>
                
            </div>
            <div class="form-field">
                <input type="date" formControlName="CourierDetails" placeholder=" " />
                <label>Courier Details</label>
                
            </div>

            <div class="form-field">
                <select formControlName="PaymentStatus">
                    <option value="">Select</option>
                    <option value="Completed">Completed</option>
                    <option value="Pending">Pending</option>

                </select>
                <label>Payment Status</label>
                
            </div>

            <div class="form-field">
                <input type="date" formControlName="PaymentInfo" placeholder=" " />
                <label>Payment Info</label>               
            </div>
            <!-- <div class="form-field">
                    <input type="date" formControlName="NEFT" placeholder=" " />
                    <label>NEFT</label>
                    <small class="error"
                        *ngIf="InsuranceClaimTracking.get('NEFT')?.touched && InsuranceClaimTracking.get('NEFT')?.invalid">
                        NEFT is required
                    </small>
                </div> -->

            <div class="form-field">
                <input type="text" formControlName="UTR" placeholder=" " />
                <label>UTR</label>                
            </div>

            <div class="form-field">
                <input type="Date" formControlName="ClaimSettlementDate" placeholder=" " />
                <label>ClaimSettlementDate</label>               
            </div>



        </form>
        <!-- Submit / Cancel Buttons -->
        <div class="text-right">
            <button type="button" class="btn btn-md btn-raised btnSave" (click)="savePlan()">
                Save
            </button>
        </div>
    </div>
</div>
