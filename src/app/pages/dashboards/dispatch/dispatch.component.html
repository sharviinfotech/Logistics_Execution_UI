<div class="card-LE">
  <div class="card-header-LE">Dispatch</div>

    <div class="card-body-LE">

    <!-- 🔹 Order Type (Inward / Outward) -->
    <div class="form-radio optional">
      <label>
        <input type="radio" name="orderType" [(ngModel)]="orderType" value="Inward" (change)="onOrderTypeChange()" />
        <span>Inward</span>
      </label>
      <label>
        <input type="radio" name="orderType" [(ngModel)]="orderType" value="Outward" (change)="onOrderTypeChange()" />
        <span>Outward</span>
      </label>
    </div>

    <br />

    <!-- 🔹 SAP Type (With / Without SAP) -->
    <div *ngIf="orderType" class="sap-row" style="display: flex !important;">
      <div class="form-radio optional sap-radio">
        <label>
          <input type="radio" [(ngModel)]="sapType" value="SAP" (change)="onSapTypeChange()" />
          <span>With SAP</span>
        </label>
        <label>
          <input type="radio" [(ngModel)]="sapType" value="Non-SAP" (change)="onSapTypeChange()" />
          <span>Without SAP</span>
        </label>
      </div>
    </div>

    <br />

    
    <form [formGroup]="dispatchForm" *ngIf="showForm">
      <table class="table shipment-table">
        <thead>
          <tr>
            <th>SI.No</th>
            <th>Vehicle Type</th>
            <th>Workorder</th>
            <th>No Of Trucks</th>
            <th>Transporter</th>
            <th>LR Number</th>
            <th>Loading Points</th>
            <th>UnLoading Points</th>
            <th *ngIf="showActionColumn">Action</th>
          </tr>
        </thead>

        <tbody formArrayName="rows">
          <tr *ngFor="let row of rows.controls; let i = index" [formGroupName]="i">

            <td>{{ i + 1 }}</td>
            <!-- <td><input type="text" formControlName="VehicleType"></td> -->
            <td>
              <select formControlName="VehicleType">
                <option value="" disabled>Select Vehicle Type</option>
                <option value="Cargo">Cargo</option>
                <option value="Rate Contract">Rate Contract</option>
                <option value="Local Transportation">Local Transportation</option>
                <option value="Customer Transporter">Customer Transporter</option>
                <option value="Company Vehicle">Company Vehicle</option>
                <option value="Courier">Courier</option>
                <option value="By Hand">By Hand</option>
                <option value="Full Truck Load">Full Truck Load</option>

              </select>
            </td>

            <!-- <td><input type="text" formControlName="workorder"></td> -->
            <!-- <td *ngIf="row.get('VehicleType')?.value === 'Full Truck Load'">
              <input type="text" formControlName="workorder" />
            </td> -->
            <!-- <td *ngIf="row.get('VehicleType')?.value !== 'Full Truck Load'">
   </td> -->
            <td>
              <input *ngIf="row.get('VehicleType')?.value === 'Full Truck Load'" type="text"
                formControlName="workorder" />

              <span *ngIf="row.get('VehicleType')?.value !== 'Full Truck Load'">
              </span>
            </td>


            <td><input type="text" formControlName="NoOfTrucks"></td>
            <td><input type="text" formControlName="Transporter"></td>
            <td><input type="text" formControlName="LRNumber"></td>
            <td><input type="text" formControlName="LoadingPoints"></td>
            <td><input type="text" formControlName="UnLoadingPoints"></td>

            
            <td class="action-btns"*ngIf="showActionColumn">

              
              <ng-container *ngIf="rows.at(0).get('VehicleType')?.value === 'Full Truck Load'">
                <button type="button" class="btn-add" (click)="addRow()">+</button>
                <button type="button" class="btn-remove" *ngIf="i !== 0" (click)="removeRow(i)">
                  ✖
                </button>

              </ng-container>
            </td>
          </tr>
        </tbody>
      </table>
    </form>
    <div class="text-right" *ngIf="showForm">
      <button class="btn btn-md btn-raised btnSave" (click)="save()">Save</button>
    </div>

  </div>
