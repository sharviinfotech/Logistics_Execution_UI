<div class="card-LE">
  <div class="card-header-LE">Transit Damage Info</div>

  <div class="card-body-LE">

    <!-- ORDER TYPE -->
    <div class="form-radio optional">
      <label>
        <input type="radio" name="orderType" [(ngModel)]="orderType" value="Inward" (change)="onOrderTypeSelection()" />
        <span>Inward</span>
      </label>

      <label>
        <input type="radio" name="orderType" [(ngModel)]="orderType" value="Outward"
          (change)="onOrderTypeSelection()" />
        <span>Outward</span>
      </label>
    </div>

    <br />

    <!-- SAP TYPE -->
    <div *ngIf="orderType" class="sap-row" style="display: flex !important;">
      <div class="form-radio optional sap-radio">
        <label>
          <input type="radio" [(ngModel)]="sapType" value="SAP" (change)="onSapTypeSelection()" />
          <span>With SAP</span>
        </label>
        <label>
          <input type="radio" [(ngModel)]="sapType" value="Non-SAP" (change)="onSapTypeSelection()" />
          <span>Without SAP</span>
        </label>
      </div>

      <!-- INVOICE INPUT -->
      <div class="input-row" *ngIf="sapType">
        <div class="input-flex">
          <div class="form-field flex-1">
            <input type="text" name="invoicenumber" [(ngModel)]="invoicenumber" placeholder=" " />
            <label>Invoice Number</label>
          </div>

          <!-- ✅ NOW CALLS API FUNCTION -->
          <button type="button" class="btn-get"
            (click)="sapType === 'SAP' ? fetchInvoiceDetails() : fetchInvoiceDetailsnonsap()"
            [disabled]="!invoicenumber || invoicenumber.trim() === ''">
            GET
          </button>

        </div>
      </div>

    </div>

    <br />

    <!-- ✅ HEADER FORM -->
    <form [formGroup]="HeaderForm" *ngIf="showTable" class="form-grid">

      <div class="form-field">
        <input type="date" formControlName="INV_DATE" placeholder=" " />
        <label>Invoice Date</label>
      </div>

      <div class="form-field">
        <input type="date" formControlName="FSR_RPT_DT" placeholder=" " />
        <label>FSR Report Date</label>
      </div>

      <div class="form-field">
        <input type="text" formControlName="BASIC_VALUE" placeholder=" " />
        <label>Invoice Basic Value</label>
      </div>

      <div class="form-field">
        <input type="date" formControlName="INC_DATE" placeholder=" " />
        <label>Incident Date</label>
      </div>

      <div class="form-field">
        <input type="text" formControlName="CUSTOMER" placeholder=" " />
        <label>Customer</label>
      </div>

      <div class="form-field">
        <input type="text" formControlName="CONSIGN_NAME" placeholder=" " />
        <label>C/nee Name</label>
      </div>

      <div class="form-field">
        <input type="text" formControlName="DAMAGE_RMK" placeholder=" " />
        <label>Damage Remarks</label>
      </div>

      <div class="form-field">
        <input type="text" formControlName="SETTLEMENT" placeholder=" " />
        <label>Settlement</label>
      </div>

      <div class="form-field">
        <input type="date" formControlName="CLOSING_DT" placeholder=" " />
        <label>Closing Date</label>
      </div>

      <div class="form-field upload-field">
        <label class="floating-label">Images</label>
        <input type="file" formControlName="IMAGES" id="imagesuploading" class="custom-file-input"
          accept=".jpg,.jpeg,.png,.pdf" />
      </div>

    </form>

    <br />

    <!-- ✅ ITEMS TABLE -->
    <div *ngIf="showTable" style="overflow:auto;">
      <form [formGroup]="ItemForm">
        <table class="table table-bordered">
          <thead>
            <tr>
              <th>SI.No</th>
              <th>Vehicle Line</th>
              <th>Vehicle Number</th>
              <th>LR Number</th>
              <th>Transporter</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody formArrayName="ITEMS">
            <tr *ngFor="let item of items.controls; let i = index" [formGroupName]="i">

              <td>{{ i + 1 }}</td>
              <td><input formControlName="VEH_LINE"></td>
              <td><input formControlName="TRUCK_NO"></td>
              <td><input formControlName="LR_NO"></td>
              <td><input formControlName="TRANSPORTER"></td>

              <td>
                <button type="button" (click)="addItemRow()">+</button>
                <button type="button" (click)="removeItemRow(i)">✖</button>
              </td>

            </tr>
          </tbody>

        </table>
      </form>
    </div>

    <br />

    <!-- ✅ SAP BUTTON GROUP -->
    <div class="text-right" *ngIf="showForm && sapType === 'SAP'">

      <button class="btn btn-md btn-raised btnSave" (click)="onSaveActionSap('stay')">
        Save
      </button>

      <button class="btn btn-md btn-raised btnSave move" (click)="onSaveActionSap('next')">
        Save and Next
      </button>

      <button class="btn btn-md btn-raised btnSave prev" (click)="onSaveActionSap('previous')">
        Save and Previous
      </button>

    </div>



    <!-- ✅ NON-SAP BUTTON GROUP -->
    <div class="text-right" *ngIf="showForm && sapType === 'Non-SAP'">

      <button class="btn btn-md btn-raised btnSave" (click)="onSaveNonSap('stay')">
        Save
      </button>

      <button class="btn btn-md btn-raised btnSave move" (click)="onSaveNonSap('next')">
        Save and Next
      </button>

      <button class="btn btn-md btn-raised btnSave prev" (click)="onSaveNonSap('previous')">
        Save and Previous
      </button>

    </div>




  </div>
</div>
