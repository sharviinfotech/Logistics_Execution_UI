<div class="card-LE">
  <div class="card-header-LE">
    Order Info
  </div>

  <div class="card-body-LE">
    <!-- Order Type -->
    <div class="form-radio optional">
      <label>
        <input type="radio" name="orderType" [(ngModel)]="orderType" value="Inward" (change)="onOrderTypeChange()" />
        <span>Inward</span>
      </label>
      <label>
        <input type="radio" name="orderType" [(ngModel)]="orderType" value="Outward" (change)="onOrderTypeChange()" />
        <span>Outward</span>
      </label>
    </div>

    <br />

    <!-- SAP Type + Input -->
    <div *ngIf="orderType" class="sap-row" style="display: flex !important;">
      <!-- SAP Radio -->
      <div class="form-radio optional sap-radio">
        <label>
          <input type="radio" [(ngModel)]="sapType" value="SAP" (change)="onSapTypeChange()" />
          <span>With SAP</span>
        </label>
        <label>
          <input type="radio" [(ngModel)]="sapType" value="Non-SAP" (change)="onSapTypeChange()" />
          <span>Without SAP</span>
        </label>
      </div>

      <!-- Input + GET (only for SAP) -->
      <div class="input-row" *ngIf="sapType === 'SAP'">
        <div *ngIf="orderType === 'Inward'" class="input-flex">
          <div class="form-field flex-1">
            <input type="text" name="ponumber" [(ngModel)]="ponumber" placeholder=" "
              (input)="onInputChange('purchase')" />
            <label>PO Number</label>
          </div>
          <button type="button" class="btn-get" (click)="getForm('purchase')"
            [disabled]="!ponumber || ponumber.trim()===''">
            GET
          </button>
        </div>

        <div *ngIf="orderType === 'Outward'" class="input-flex">
          <div class="form-field flex-1">
            <input type="text" name="invoicenumber" [(ngModel)]="invoicenumber" placeholder=" "
              (input)="onInputChange('invoice')" />
            <label>Invoice Number</label>
          </div>
          <button type="button" class="btn-get" (click)="getForm('invoice')"
            [disabled]="!invoicenumber || invoicenumber.trim()===''">
            GET
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Form Section -->
  <form class="form-grid" [formGroup]="OrderInfo" *ngIf="showForm">
    <!-- Tax Invoice -->
    <div class="form-field">
      <input type="text" formControlName="TaxInvoice" placeholder=" " />
      <label>Tax Invoice Number</label>
    </div>

    <!-- ODN -->
    <div class="form-field">
      <input type="text" formControlName="ODN" placeholder=" " />
      <label>ODN Number</label>
    </div>

    <!-- Invoice Date -->
    <div class="form-field">
      <input type="text" formControlName="InvoiceData" placeholder=" " />
      <label>Invoice Date</label>
    </div>

    <!-- Basic Shipment -->
    <div class="form-field">
      <input type="text" formControlName="BasicShipment" placeholder=" " />
      <label>Basic Shipment Value</label>
    </div>

    <!-- Item Number
    <div class="form-field">
      <input type="text" formControlName="Itemnumber" placeholder=" " />
      <label>Item Number</label>
    </div> -->

    <!-- Invoice With GST -->
    <div class="form-field">
      <input type="text" formControlName="InvoiceWithGst" placeholder=" " />
      <label>Invoice Value With GST</label>
    </div>

    <!-- Fiscal Year -->
    <div class="form-field">
      <input type="text" formControlName="FinanceYear" placeholder=" " />
      <label>Fiscal Year</label>
    </div>

    <!-- Fiscal Quarter -->
    <div class="form-field">
      <select formControlName="FiscalQuarter">
        <option value="">Select Quarter</option>
        <option value="Q1">Q1 (Apr - Jun)</option>
        <option value="Q2">Q2 (Jul - Sep)</option>
        <option value="Q3">Q3 (Oct - Dec)</option>
        <option value="Q4">Q4 (Jan - Mar)</option>
      </select>
      <label>Fiscal Quarter</label>
    </div>

    <!-- Month
    <div class="form-field">
      <select formControlName="Month">
        <option value="">Select Month</option>
        <option *ngFor="let m of months" [value]="m">
          {{ m }}
        </option>
      </select>
      <label>Month</label>
    </div> -->

        <option value="">Select Month</option>
        <option value="January">January</option>
        <option value="February">February</option>
        <option value="March">March</option>
        <option value="April">April</option>
        <option value="May">May</option>
        <option value="June">June</option>
        <option value="July">July</option>
        <option value="August">August</option>
        <option value="September">September</option>
        <option value="October">October</option>
        <option value="November">November</option>
        <option value="December">December</option>
      </select>
      <label>Month</label>
    </div>




    <!-- Physical Dispatch -->
    <div class="form-field">
      <input type="datetime-local" formControlName="PhysicalDispatchDateTime" placeholder=" " />
      <label>Physical Dispatch Date & Time</label>

    <div class="form-field">
      <ng-container *ngIf="!isSap(); else sapPlant">
        <select formControlName="Plant" (change)="onPlantChange()">
          <option value="">Select Plant</option>
          <option *ngFor="let p of plantList" [value]="p.PLANT">{{ p.PLANT }} - {{ p.PLANT_DESC }}</option>
        </select>
      </ng-container>
      <ng-template #sapPlant>

      <label>Plant</label>
    </div>

      <input type="text" formControlName="Plantdescription" readonly />
      <label>Plant Description</label>
    </div>

    <!-- Transaction Type -->
    <div class="form-field">
      <select formControlName="TransactionType">
        <option value="">Select Mode of Transport</option>
        <option value="FULLTRUCKLOAD">FULL TRUCK LOAD</option>
        <option value="CARGO">CARGO</option>
        <option value="RATECONTRACT">RATE CONTRACT</option>
        <option value="LOCALTRANSPORTATION">LOCAL TRANSPORTATION</option>
        <option value="CUSTOMERTRANSPORTER">CUSTOMER TRANSPORTER</option>

        <option value="COURIER">COURIER</option>
        <option value="BYHAND">BY HAND</option>

    <!-- 🧾 Billing Type -->
    <div class="form-field">
      <ng-container *ngIf="!isSap(); else sapBilling">
        <select formControlName="BillingTransactionType" (change)="onBillingTypeChange()">
          <option value="">Select Billing Type</option>
          <option *ngFor="let b of billintypeList" [value]="b.BILL_TYPE">
            {{ b.BILL_TYPE }} - {{ b.BILL_TYPE_DESC }}
          </option>
        </select>
      </ng-container>
      <ng-template #sapBilling>
        <input type="text" formControlName="BillingTransactionType" readonly />
      </ng-template>
      <label>Billing Transaction Type</label>
    </div>
    <div class="form-field" *ngIf="!isSap()">
      <input type="text" formControlName="Billingdescription" readonly />
      <label>Billing Description</label>
    </div>

    <!-- 🏢 Division -->
    <div class="form-field">
      <ng-container *ngIf="!isSap(); else sapDivision">
        <select formControlName="Division" (change)="onDivisionChange()">
          <option value="">Select Division</option>
          <option *ngFor="let d of divisionList" [value]="d.DIVISION">{{ d.DIVISION }} - {{ d.DIVISION_DESC }}</option>
        </select>
      </ng-container>
      <ng-template #sapDivision>
        <input type="text" formControlName="Division" readonly />
      </ng-template>
      <label>Division</label>
    </div>
    <div class="form-field" *ngIf="!isSap()">
      <input type="text" formControlName="Divisiondescription" readonly />
      <label>Division Description</label>
    </div>

    <!-- Sub Division -->
    <div class="form-field">
      <select formControlName="SubDivision">
        <option value="">Select Sub Division</option>
        <option value="FUZE">FUZE</option>
        <option value="IPS SYSTEM">IPS SYSTEM</option>
        <option value="LITHIUM">LITHIUM</option>
        <option value="NCFP">NCFP</option>
        <option value="NCPP">NCPP</option>
        <option value="NCPP-VSEZ">NCPP-VSEZ</option>
        <option value="NCPP/ETP">NCPP/ETP</option>
        <option value="NCSP">NCSP</option>
        <option value="PE">PE</option>
        <option value="SILVER ZINC">SILVER ZINC</option>
        <option value="SYSTEM ORDERS">SYSTEM ORDERS</option>
        <option value="THERMAL">THERMAL</option>
        <option value="THERMAL,FUZE,SZ">THERMAL,FUZE,SZ</option>
      </select>
      <label>Sub Division</label>
    </div>

    <!-- Ref Number -->
    <div class="form-field">
      <input type="text" formControlName="RefNumber" placeholder=" " />
      <label>SO / Ref. Number</label>
    </div>

    <!-- Customer -->
    <div class="form-field">
      <input type="text" formControlName="Customer" placeholder=" " />
      <label>Customer</label>
    </div>

    <!-- Customer Group -->
    <div class="form-field">
      <input type="text" formControlName="CustomerGroup" placeholder=" " />
      <label>Customer Group</label>
    </div>

    <!-- C/nee -->
    <div class="form-field">
      <input type="text" formControlName="CNee" placeholder=" " />
      <label>C/nee</label>
    </div>

    <!-- Destination Location -->
    <div class="form-field">
      <input type="text" formControlName="DestinationLocation" placeholder=" " />
      <label>Destination Location</label>
    </div>

    <!-- Destination State -->
    <div class="form-field">
      <input type="text" formControlName="DestinationState" placeholder=" " />
      <label>Destination State</label>
    </div>

    <!-- Destination Zone -->
    <div class="form-field">
      <input type="text" formControlName="DestinationZone" placeholder=" " />
      <label>Destination Zone</label>
    </div>
  </form>

  <!-- Buttons -->
  <div class="text-right" *ngIf="showForm">
    <button type="submit" class="btn btn-md btn-raised btnSave" (click)="saveOutwardInvoiceData()">
      Save
    </button>
  </div>
</div>
