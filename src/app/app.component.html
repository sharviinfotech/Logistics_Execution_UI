<!-- Pulse Spinner -->
<ngx-spinner
  bdColor="rgba(0, 0, 0, 0.8)"
  size="medium"
  color="#fff"
  type="line-scale-pulse-out-rapid"
  [fullScreen]="true">
  <p style="color: white"> Please Wait Loading... </p>
</ngx-spinner>
